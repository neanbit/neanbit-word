server {
  server_name word.neanbit.com;
  root /var/www/neanbit-word;
  index index.html;

  # Archivos con extensión: tal cual. Cualquier otra ruta (/clasico, /futbol...)
  # devuelve index.html y la app resuelve cuál juego mostrar.
  location / {
    try_files $uri /index.html;
  }

  location ~* \.(js|css|webmanifest)$ { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=604800"; }
}
